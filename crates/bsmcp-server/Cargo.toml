[package]
name = "bsmcp-server"
edition.workspace = true
version.workspace = true

[dependencies]
bsmcp-common = { path = "../bsmcp-common" }
bsmcp-db-sqlite = { path = "../bsmcp-db-sqlite" }
bsmcp-db-postgres = { path = "../bsmcp-db-postgres" }
tokio = { version = "1", features = ["full"] }
tracing = { workspace = true }
axum = { version = "0.8", features = ["tokio", "multipart"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio-stream = "0.1"
futures = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
subtle = "2"
zeroize = "1"
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
pgvector = { version = "0.4", features = ["sqlx"] }
# Forces openssl-sys to vendor (build OpenSSL from source) so cross-builds
# (notably aarch64-unknown-linux-gnu) don't need a target-architecture sysroot
# with libssl-dev. Reaches openssl-sys through reqwest -> hyper-tls -> native-tls.
# release.yml's binary matrix builds bsmcp-server for all five targets, so this
# crate is the right place for the dep.
openssl = { version = "0.10", features = ["vendored"] }
